name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_HOST" || { echo "Missing required secret: VPS_HOST"; exit 1; }
          test -n "$VPS_USER" || { echo "Missing required secret: VPS_USER"; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo "Missing required secret: VPS_SSH_KEY"; exit 1; }
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            export PATH="/root/.nvm/versions/node/v20.20.2/bin:$PATH"
            for dir in app.bizbitenow.in krishnabakery.bizbitenow.in delightpizza.bizbitenow.in idlianna.bizbitenow.in kesariyarasoi.bizbitenow.in brewhouse.bizbitenow.in sunrisebakery.bizbitenow.in centricarestaurant.com yummypoint.in; do
              echo "=== Deploying $dir ==="
              cd /var/www/$dir
              git pull origin main
              npm install
              npm run build
            done
