name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            export PATH="/root/.nvm/versions/node/v20.20.2/bin:$PATH"
            for dir in app.bizbitenow.in krishnabakery.bizbitenow.in delightpizza.bizbitenow.in idlianna.bizbitenow.in kesariyarasoi.bizbitenow.in brewhouse.bizbitenow.in sunrisebakery.bizbitenow.in centricarestaurant.com yummypoint.in; do
              echo "=== Deploying $dir ==="
              cd /var/www/$dir
              git pull origin main
              npm install
              npm run build
            done
